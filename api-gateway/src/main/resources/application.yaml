server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@ipKeyResolver}"
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**
            - id: catalog-service
              uri: lb://catalog-service
              predicates:
                - Path=/products/**,/categories/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/orders/**

app:
  jwt:
    secret: ${JWT_SECRET:change-me-this-is-a-local-dev-secret-0123456789}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/